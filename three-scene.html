<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js 測試場景</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b1f24;           /* 16:9 畫面以外的留白 */
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 固定 16:9，依視窗大小縮放並置中 */
    #stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      container-type: size;        /* 讓字卡用 cqw 隨畫面等比縮放 */
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: #1d2733;
    }
    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #stage.free canvas { cursor: grab; }
    #stage.free canvas:active { cursor: grabbing; }

    /* ----- 疊在 3D 上的字卡層 ----- */
    .layer { position: absolute; inset: 0; pointer-events: none; }
    #fade { background: #e9eef3; opacity: 0; }
    .center-card {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; text-align: center;
    }
    .center-card .big { font-size: 5.2cqw; font-weight: 900; letter-spacing: 0.04em; }
    .center-card .small { margin-top: 1cqw; font-size: 1.6cqw; color: #4b5866; font-weight: 500; }
    .center-card .bar { width: 6cqw; height: 0.4cqw; border-radius: 1cqw; background: #22b866; margin-bottom: 1.6cqw; }

    #titleCard { padding-bottom: 18cqh; }   /* 標題放上方，避開下方的設備 */
    #step {
      position: absolute; left: 3.5cqw; bottom: 9cqh;
      display: flex; align-items: center; gap: 1.2cqw;
      padding: 1.1cqw 2cqw 1.1cqw 1.2cqw;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 1.2cqw;
      box-shadow: 0 0.6cqw 2.4cqw rgba(22, 33, 58, 0.18);
      opacity: 0;
    }
    #step .no {
      background: #22b866; color: #fff; font-weight: 800;
      font-size: 1.25cqw; letter-spacing: 0.05em;
      padding: 0.5cqw 0.9cqw; border-radius: 0.7cqw; white-space: nowrap;
    }
    #step .title { font-size: 2.3cqw; font-weight: 800; white-space: nowrap; }

    .label {
      position: absolute; transform: translate(-50%, -100%);
      background: #fff; border-radius: 0.8cqw;
      padding: 0.55cqw 1.1cqw; white-space: nowrap;
      font-size: 1.3cqw; font-weight: 700;
      box-shadow: 0 0.4cqw 1.6cqw rgba(22, 33, 58, 0.2);
      opacity: 0;
    }
    .label::before {
      content: ''; display: inline-block; width: 0.7cqw; height: 0.7cqw; border-radius: 50%;
      background: #22b866; margin-right: 0.6cqw; vertical-align: 0.1cqw;
    }
    .label::after {
      content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
      border: 0.6cqw solid transparent; border-top-color: #fff;
    }

    /* ----- 播放控制列（滑鼠移動時才出現） ----- */
    #hud {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 1.2cqw;
      padding: 1cqw 2cqw;
      background: linear-gradient(transparent, rgba(15, 23, 34, 0.55));
      opacity: 0; transition: opacity 0.3s;
    }
    #stage.show-hud #hud, #stage.free #hud { opacity: 1; }
    #hud button {
      width: 3cqw; height: 3cqw; border: 0; border-radius: 50%;
      background: #fff; color: #16213a; font-size: 1.2cqw; cursor: pointer;
    }
    #bar { position: relative; flex: 1; height: 0.6cqw; background: rgba(255, 255, 255, 0.35); border-radius: 1cqw; cursor: pointer; }
    #fill { position: absolute; left: 0; top: 0; bottom: 0; background: #22b866; border-radius: 1cqw; }
    #bar .tick { position: absolute; top: -0.3cqw; width: 0.15cqw; height: 1.2cqw; background: rgba(255, 255, 255, 0.7); }
    #time { color: #fff; font-size: 1.2cqw; font-variant-numeric: tabular-nums; min-width: 7cqw; text-align: right; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <div class="layer" id="labels"></div>
    <div class="layer" id="fade"></div>
    <div class="layer">
      <div class="center-card" id="titleCard">
        <div class="bar"></div>
        <div class="big">QA-100 操作指南</div>
        <div class="small">桌上型分析儀・3D 操作示範</div>
      </div>
      <div class="center-card" id="endCard">
        <div class="bar"></div>
        <div class="big">QA-100 操作說明</div>
        <div class="small">感謝觀看</div>
      </div>
      <div id="step"><span class="no"></span><span class="title"></span></div>
    </div>
    <div id="hud">
      <button id="playBtn" title="播放／暫停（空白鍵）">❚❚</button>
      <div id="bar"><div id="fill"></div></div>
      <span id="time">0.0 / 61s</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const stage = document.getElementById('stage');

    // ---------- Renderer ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;   // 柔和陰影
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    // ---------- Scene：淺灰藍背景 + 霧 ----------
    const BG = 0xb8c6d4;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG);
    scene.fog = new THREE.Fog(BG, 16, 50);

    // ---------- Camera（固定 16:9） ----------
    const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 200);
    camera.position.set(1.5, 4.3, 8.6);

    // ---------- Lights ----------
    // 天空光：上方偏藍白、下方偏地面灰
    const hemi = new THREE.HemisphereLight(0xe6f0ff, 0x8a8f96, 1.5);
    scene.add(hemi);

    // 太陽光：產生陰影
    const sun = new THREE.DirectionalLight(0xfff4e5, 2.2);
    sun.position.set(-6, 9, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
    sun.shadow.radius = 4;
    scene.add(sun);

    // ---------- 地板 ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0xc9d3dc, roughness: 1, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // =====================================================
    //  設備（全部由基本形狀組成）
    // =====================================================

    // ---------- 共用材質 ----------
    const M = {
      white:    new THREE.MeshStandardMaterial({ color: 0xf7f8fa, roughness: 0.45 }),
      offWhite: new THREE.MeshStandardMaterial({ color: 0xe9ecef, roughness: 0.4 }),
      screen:   new THREE.MeshStandardMaterial({ color: 0x0a0b0d, roughness: 0.2, metalness: 0.1 }),
      dark:     new THREE.MeshStandardMaterial({ color: 0x2a2e34, roughness: 0.7 }),
      silver:   new THREE.MeshStandardMaterial({ color: 0xc9cdd3, roughness: 0.35, metalness: 0.35 }),
      keys:     new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.8 }),
      stand:    new THREE.MeshStandardMaterial({ color: 0x8b929b, roughness: 0.4, metalness: 0.3 }),
      green:    new THREE.MeshStandardMaterial({ color: 0x35d07f, emissive: 0x22c06a, emissiveIntensity: 1.2 }),
      blue:     new THREE.MeshStandardMaterial({ color: 0x2f6fe0, roughness: 0.5 }),
    };

    // 小工具：圓角方塊 / 一般方塊
    const rbox = (w, h, d, r, mat) =>
      new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2, h / 2, d / 2)), mat);
    const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);

    // ---------- 中間：白色桌上型分析儀 ----------
    const analyzer = new THREE.Group();
    analyzer.name = 'analyzer';
    scene.add(analyzer);

    const BODY_W = 2.4, BODY_H = 1.4, BODY_D = 2.0;
    const body = rbox(BODY_W, BODY_H, BODY_D, 0.15, M.white);
    body.position.y = BODY_H / 2;
    analyzer.add(body);

    // 斜放觸控螢幕的楔形底座（三角形斷面擠出）
    const wedgeShape = new THREE.Shape();
    wedgeShape.moveTo(0.35, 0);     // (x = 前後方向, y = 高度)
    wedgeShape.lineTo(-0.45, 0);
    wedgeShape.lineTo(-0.45, 0.42);
    wedgeShape.closePath();
    const wedgeGeo = new THREE.ExtrudeGeometry(wedgeShape, { depth: 1.4, bevelEnabled: false });
    wedgeGeo.rotateY(-Math.PI / 2);   // 斷面 x → 世界 z，擠出方向 → 世界 -x
    const wedge = new THREE.Mesh(wedgeGeo, M.white);
    wedge.position.set(0.4, BODY_H, 0);   // x 範圍 -1.0 ~ 0.4（偏左，右後留給電源鍵）
    analyzer.add(wedge);

    // 全版黑色觸控螢幕（無白邊，蓋滿整個楔形斜面）
    const slope = Math.atan2(0.42, 0.8);
    const SLOPE_LEN = Math.hypot(0.8, 0.42);
    const bezel = rbox(1.4, 0.05, SLOPE_LEN, 0.02, M.screen);
    bezel.rotation.x = slope;
    bezel.position.set(-0.3, BODY_H + 0.21 + 0.025, -0.05);
    analyzer.add(bezel);
    const touchScreen = box(1.38, 0.006, SLOPE_LEN - 0.02, M.screen);
    touchScreen.name = 'analyzerScreen';
    touchScreen.position.y = 0.032;
    bezel.add(touchScreen);

    // 右後方：電源鍵 + 綠色指示燈環
    const power = new THREE.Group();
    power.position.set(0.82, BODY_H, -0.6);
    analyzer.add(power);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.025, 12, 40), M.green);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.012;
    ring.castShadow = false;
    power.add(ring);
    const powerBtn = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.1, 0.05, 32), M.offWhite);
    powerBtn.position.y = 0.025;
    power.add(powerBtn);

    // 前方艙門開口（深色內凹面，門打開時可見）
    const DOOR_W = 1.3, DOOR_H = 0.62;
    const cavity = box(DOOR_W - 0.06, DOOR_H - 0.06, 0.02, M.dark);
    cavity.position.set(0, 0.3 + DOOR_H / 2, BODY_D / 2 + 0.001);
    analyzer.add(cavity);

    // 艙門「轉軸群組」：轉軸在門的下緣，繞 X 軸旋轉
    //   doorHinge.rotation.x = 0          → 關閉
    //   doorHinge.rotation.x = Math.PI/2  → 往下完全打開
    const doorHinge = new THREE.Group();
    doorHinge.name = 'doorHinge';
    doorHinge.position.set(0, 0.3, BODY_D / 2);   // 門下緣、機身前表面
    analyzer.add(doorHinge);

    const door = rbox(DOOR_W, DOOR_H, 0.06, 0.03, M.offWhite);
    door.position.set(0, DOOR_H / 2, 0.03);       // 以轉軸為原點往上長
    doorHinge.add(door);
    const doorHandle = rbox(0.5, 0.06, 0.05, 0.02, M.silver);
    doorHandle.position.set(0, DOOR_H - 0.09, 0.08);
    doorHinge.add(doorHandle);

    // ---------- 左邊：銀色筆電 ----------
    const laptop = new THREE.Group();
    laptop.name = 'laptop';
    laptop.position.set(-3.5, 0, 0.4);
    laptop.rotation.y = 0.35;
    scene.add(laptop);

    const lapBase = rbox(2.0, 0.08, 1.4, 0.03, M.silver);
    lapBase.position.y = 0.04;
    laptop.add(lapBase);
    const keyboard = box(1.72, 0.006, 0.55, M.keys);
    keyboard.position.set(0, 0.082, -0.18);
    laptop.add(keyboard);
    const touchpad = box(0.62, 0.004, 0.36, M.offWhite);
    touchpad.position.set(0, 0.081, 0.38);
    laptop.add(touchpad);

    // 螢幕轉軸：在底座後緣，微微往後傾
    const lidHinge = new THREE.Group();
    lidHinge.name = 'laptopLidHinge';
    lidHinge.position.set(0, 0.08, -0.68);
    lidHinge.rotation.x = -0.22;
    laptop.add(lidHinge);
    const lid = rbox(2.0, 1.3, 0.06, 0.03, M.silver);
    lid.position.set(0, 0.65, -0.03);
    lidHinge.add(lid);
    const lapScreen = box(1.84, 1.12, 0.006, M.screen);
    lapScreen.name = 'laptopScreen';
    lapScreen.position.set(0, 0.67, 0.002);
    lidHinge.add(lapScreen);

    // ---------- 右邊：立架上的手機 ----------
    const phoneStand = new THREE.Group();
    phoneStand.name = 'phoneStand';
    phoneStand.position.set(3.3, 0, 0.5);
    phoneStand.rotation.y = -0.35;
    scene.add(phoneStand);

    const standBase = rbox(0.85, 0.06, 0.75, 0.03, M.stand);
    standBase.position.y = 0.03;
    phoneStand.add(standBase);

    // 傾斜的部分（背板 + 托唇 + 手機）
    const lean = new THREE.Group();
    lean.position.set(0, 0.06, 0.12);
    lean.rotation.x = -0.3;
    phoneStand.add(lean);

    const backPlate = rbox(0.6, 1.0, 0.05, 0.02, M.stand);
    backPlate.position.set(0, 0.5, -0.065);
    lean.add(backPlate);
    const lip = rbox(0.7, 0.12, 0.06, 0.02, M.stand);
    lip.position.set(0, 0.06, 0.07);
    lean.add(lip);
    const brace = box(0.08, 0.06, 0.5, M.stand);     // 底座到背板的支撐
    brace.position.set(0, 0.03, -0.2);
    lean.add(brace);

    const phone = rbox(0.62, 1.25, 0.07, 0.05, M.offWhite);
    phone.name = 'phone';
    phone.position.set(0, 0.06 + 1.25 / 2, 0);
    lean.add(phone);
    const phoneScreen = box(0.56, 1.15, 0.006, M.screen);
    phoneScreen.name = 'phoneScreen';
    phoneScreen.position.set(0, phone.position.y, 0.036);
    lean.add(phoneScreen);

    // ---------- 前方桌面：小盒子（無蓋）＋ 白色檢測試片（側邊藍色條紋） ----------
    const stripBox = new THREE.Group();
    stripBox.name = 'stripBox';
    stripBox.position.set(0.3, 0, 2.4);
    stripBox.rotation.y = 0.15;
    scene.add(stripBox);

    const BOX_W = 1.8, BOX_D = 0.56, BOX_H = 0.16, WALL = 0.04, FLOOR = 0.03;
    const trayMat = new THREE.MeshStandardMaterial({ color: 0xd4dbe2, roughness: 0.6 });
    const trayFloor = box(BOX_W, FLOOR, BOX_D, trayMat);
    trayFloor.position.y = FLOOR / 2;
    stripBox.add(trayFloor);
    [  // [寬, 深, x, z]：前、後、左、右四面牆
      [BOX_W, WALL, 0,  BOX_D / 2 - WALL / 2],
      [BOX_W, WALL, 0, -BOX_D / 2 + WALL / 2],
      [WALL, BOX_D, -BOX_W / 2 + WALL / 2, 0],
      [WALL, BOX_D,  BOX_W / 2 - WALL / 2, 0],
    ].forEach(([w, d, x, z]) => {
      const wall = box(w, BOX_H, d, trayMat);
      wall.position.set(x, BOX_H / 2, z);
      stripBox.add(wall);
    });

    // 試片：放在盒底上
    const strip = new THREE.Group();
    strip.name = 'testStrip';
    strip.position.y = FLOOR;
    stripBox.add(strip);

    const stripBody = rbox(1.6, 0.03, 0.36, 0.01, M.white);
    stripBody.position.y = 0.015;
    strip.add(stripBody);
    const stripStripe = box(1.6, 0.032, 0.06, M.blue);
    stripStripe.position.set(0, 0.016, -0.15);   // 沿著長邊的一側
    strip.add(stripStripe);

    // 所有設備都投射 / 接收陰影
    [analyzer, laptop, phoneStand, stripBox].forEach(g =>
      g.traverse(o => { if (o.isMesh) { o.castShadow = o !== ring; o.receiveShadow = true; } })
    );

    // 方便之後做動畫或在主控台測試：window.doorHinge.rotation.x = Math.PI / 2
    Object.assign(window, { scene, doorHinge, analyzer });

    // =====================================================
    //  螢幕介面：Canvas 2D 畫好後當成 CanvasTexture 貼到 3D 螢幕
    // =====================================================

    const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","WenQuanYi Zen Hei",system-ui,sans-serif';
    const C = {
      ink: '#1d2733', sub: '#6b7785', line: '#e3e8ee', bg: '#f3f6f9', white: '#ffffff',
      green: '#22b866', greenSoft: '#e6f7ee', blue: '#2f6fe0', blueSoft: '#e8f0fd',
      navy: '#16213a', amber: '#f2a33a', red: '#e5484d',
    };

    // ----- 繪圖小工具 -----
    function txt(c, s, x, y, px, o = {}) {
      c.font = `${o.weight || 500} ${px}px ${FONT}`;
      c.fillStyle = o.color || C.ink;
      c.textAlign = o.align || 'center';
      c.textBaseline = o.baseline || 'middle';
      c.fillText(String(s), x, y);
      return c.measureText(String(s)).width;
    }
    function rr(c, x, y, w, h, r, fill, stroke, lw = 2) {
      c.beginPath();
      c.roundRect(x, y, w, h, r);
      if (fill) { c.fillStyle = fill; c.fill(); }
      if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
    }
    function circle(c, x, y, r, fill, stroke, lw = 2) {
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      if (fill) { c.fillStyle = fill; c.fill(); }
      if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
    }
    function checkIcon(c, x, y, r, color) {
      circle(c, x, y, r, color);
      c.beginPath();
      c.moveTo(x - r * 0.42, y + r * 0.02);
      c.lineTo(x - r * 0.12, y + r * 0.32);
      c.lineTo(x + r * 0.45, y - r * 0.3);
      c.strokeStyle = '#fff'; c.lineWidth = r * 0.15;
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.stroke();
    }
    function arcRing(c, x, y, r, frac, color, lw) {
      c.lineCap = 'round';
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
      c.strokeStyle = C.line; c.lineWidth = lw; c.stroke();
      if (frac > 0) {
        c.beginPath();
        c.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(frac, 1));
        c.strokeStyle = color; c.lineWidth = lw; c.stroke();
      }
    }
    // 示意用 QR Code 圖樣（固定亂數，不是真的可掃描 QR）
    function qr(c, x, y, size, seed = 7) {
      const N = 25, s = size / N;
      let r = seed;
      const rand = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
      c.fillStyle = '#fff'; c.fillRect(x - s * 2, y - s * 2, size + s * 4, size + s * 4);
      c.fillStyle = '#111';
      const inFinder = (i, j) => (i < 8 && j < 8) || (i >= N - 8 && j < 8) || (i < 8 && j >= N - 8);
      for (let j = 0; j < N; j++)
        for (let i = 0; i < N; i++)
          if (!inFinder(i, j) && rand() > 0.52) c.fillRect(x + i * s, y + j * s, s + 0.5, s + 0.5);
      [[0, 0], [N - 7, 0], [0, N - 7]].forEach(([i, j]) => {
        c.fillStyle = '#111'; c.fillRect(x + i * s, y + j * s, 7 * s, 7 * s);
        c.fillStyle = '#fff'; c.fillRect(x + (i + 1) * s, y + (j + 1) * s, 5 * s, 5 * s);
        c.fillStyle = '#111'; c.fillRect(x + (i + 2) * s, y + (j + 2) * s, 3 * s, 3 * s);
      });
    }
    const nowHM = () => new Date().toTimeString().slice(0, 5);
    const fmt = v => Number(v).toFixed(1);

    // ----- 分析儀（1024 × 656） -----
    function aBase(c, W, H, title) {
      c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
      c.fillStyle = C.white; c.fillRect(0, 0, W, 72);
      c.fillStyle = C.line; c.fillRect(0, 72, W, 2);
      txt(c, title, 32, 37, 30, { align: 'left', weight: 700 });

      canvas.width = w; canvas.height = h;
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      // 只有正面那一面貼介面，其餘面維持黑色；螢幕自己發光所以用 Basic 材質
      const lit = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
      mesh.material = Array.from({ length: 6 }, (_, i) => (i === faceIndex ? lit : M.screen));
      screens[name] = { canvas, ctx: canvas.getContext('2d'), tex, ui, state: null, value: undefined, key: null };
    }
    // BoxGeometry 的面順序：0 +x, 1 -x, 2 +y, 3 -y, 4 +z, 5 -z
    makeScreen('analyzer', touchScreen, 2, 1024, 656, analyzerUI);
    makeScreen('laptop', lapScreen, 4, 1280, 780, laptopUI);
    makeScreen('phone', phoneScreen, 4, 540, 1108, phoneUI);

    /**
     * 切換螢幕畫面。狀態與數值都沒變時不重畫，回傳 false。
     *  analyzer：off, booting(0~1), home, loginQR, insertStrip, scanning, verified,
     *            countdown(秒), analyzing(0~100), result(數值), saved(數值)
     *  phone   ：login, camera, loginSuccess, latestResult(數值)
     *  laptop  ：overview({today, week, devices, pending}), table(最新數值)
     */
    function setScreen(name, state, value) {
      const s = screens[name];
      if (!s) { console.warn(`setScreen: 沒有螢幕「${name}」`); return false; }
      const draw = s.ui[state];
      if (!draw) { console.warn(`setScreen: ${name} 沒有狀態「${state}」`); return false; }
      const key = state + '|' + JSON.stringify(value ?? null);
      if (key === s.key) return false;
      s.key = key; s.state = state; s.value = value;
      const c = s.ctx;
      c.save();
      c.clearRect(0, 0, s.canvas.width, s.canvas.height);
      draw(c, s.canvas.width, s.canvas.height, value ?? undefined);
      c.restore();
      s.tex.needsUpdate = true;
      if (name === 'analyzer') M.green.emissiveIntensity = state === 'off' ? 0 : 1.2;  // 電源燈跟著開關
      return true;
    }

    // =====================================================
    //  QA-100 操作指南：61 秒時間軸
    //  所有畫面、動作、鏡頭都由「時間 t」直接算出來，所以可以任意跳轉、暫停、重播
    // =====================================================
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const clamp01 = x => Math.min(1, Math.max(0, x));
    const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
    const ramp = (t, a, b) => smooth((t - a) / (b - a));       // a→b 之間 0→1
    const q = (x, s) => Math.round(x / s) * s;                    // 量化，避免每格都重畫
    const DURATION = 61;

    // ----- 分段（對照分鏡表） -----
    //  [開始, 結束, 鏡頭, 段落標籤, 字卡]
    const SEGS = [
      [0, 4, 'intro', null, null],
      [4, 10, 'overview', '總覽', '準備物品'],
      [10, 15, 'power', 'STEP 1', '開啟電源'],
      [15, 20, 'screen', 'STEP 2', '開始檢測'],
      [20, 25, 'phone', 'STEP 3', '會員 App 登入'],
      [25, 31, 'door', 'STEP 4', '插入試片'],
      [31, 36, 'screen', 'STEP 5', '掃描試片'],
      [36, 41, 'screen', 'STEP 6', '等待反應'],
      [41, 46, 'screen', 'STEP 7', '分析與結果'],
      [46, 52, 'aerial', 'STEP 8', '結果同步'],
      [52, 57, 'door', 'STEP 9', '取出試片'],
      [57, 61, 'outro', null, null],
    ];
    const segIndex = t => Math.max(0, SEGS.findIndex(s => t >= s[0] && t < s[1]));

    // ----- 鏡頭：每個鏡位從 p0/t0 慢慢推到 p1/t1（位置 / 看的點） -----
    // 分析儀螢幕中心與法線（斜面朝前上方）
    const scrC = new THREE.Vector3(), scrN = V(0, Math.cos(slope), Math.sin(slope));
    scene.updateMatrixWorld(true);
    touchScreen.getWorldPosition(scrC);
    const scrCam = d => scrC.clone().addScaledVector(scrN, d);
    const SHOTS = {
      intro:    { p0: V(12, 2.6, 1.2),  p1: V(10.6, 3.0, 3.4), t0: V(0, 2.3, 0.3), t1: V(0, 2.3, 0.3) },
      overview: { p0: V(1.8, 4.8, 9.8), p1: V(0.6, 4.2, 8.6), t0: V(0, 0.7, 0.6), t1: V(0, 0.7, 0.6) },
      power:    { p0: V(2.7, 3.7, 2.5), p1: V(2.3, 3.3, 2.0), t0: V(0.7, 1.4, -0.5), t1: V(0.75, 1.4, -0.55) },
      screen:   { p0: scrCam(2.55), p1: scrCam(2.3), t0: scrC.clone(), t1: scrC.clone() },
      phone:    { p0: V(3.0, 3.3, 5.6), p1: V(2.4, 3.0, 5.0), t0: V(1.7, 1.0, 0.2), t1: V(1.7, 1.0, 0.2) },
      door:     { p0: V(2.1, 2.1, 5.3), p1: V(1.4, 1.8, 4.7), t0: V(0.1, 0.5, 1.5), t1: V(0.1, 0.5, 1.5) },
      aerial:   { p0: V(0.8, 11.5, 5.6), p1: V(-0.6, 11, 6.2), t0: V(0, 0, 0.6), t1: V(0, 0, 0.6) },
      outro:    { p0: V(1.5, 4.3, 8.6), p1: V(2.2, 5.6, 11.5), t0: V(0, 0.8, 0.6), t1: V(0, 0.8, 0.6) },
    };
    const BLEND = 1.4;   // 換鏡頭時的過場秒數
    function shotPose(seg, u) {
      const s = SHOTS[seg[2]], k = clamp01(u / (seg[1] - seg[0]));
      return { p: s.p0.clone().lerp(s.p1, k), t: s.t0.clone().lerp(s.t1, k) };
    }
    function cameraAt(t) {
      const i = segIndex(t), seg = SEGS[i];
      const pose = shotPose(seg, t - seg[0]);
      if (i > 0 && t - seg[0] < BLEND) {
        const prev = SEGS[i - 1];
        const from = shotPose(prev, prev[1] - prev[0]);
        const k = smooth((t - seg[0]) / BLEND);
        pose.p = from.p.lerp(pose.p, k);
        pose.t = from.t.lerp(pose.t, k);
      }
      return pose;
    }

    // ----- 試片：從盒子裡拿出來，飛進艙門 -----
    const restPos = strip.getWorldPosition(new THREE.Vector3());
    const restYaw = stripBox.rotation.y;
    scene.attach(strip);          // 改掛在場景下，直接用世界座標控制
    const STRIP_POSES = {
      rest:   { p: restPos,             yaw: restYaw },
      lift:   { p: V(0.2, 1.05, 2.55),  yaw: Math.PI / 2 },
      mouth:  { p: V(0, 0.6, 1.95),     yaw: Math.PI / 2 },   // 停在艙門口
      inside: { p: V(0, 0.6, 0.15),     yaw: Math.PI / 2 },   // 完全進到機器裡
    };
    const STRIP_KEYS = [
      [0, 'rest'], [26.6, 'rest'], [27.6, 'lift'], [28.3, 'mouth'], [29.0, 'inside'],   // STEP 4 飛入
      [53.4, 'inside'], [54.2, 'mouth'], [54.9, 'lift'], [55.7, 'rest'],                  // STEP 9 滑出
    ];
    function stripAt(t) {
      let i = 0;
      while (i < STRIP_KEYS.length - 1 && t >= STRIP_KEYS[i + 1][0]) i++;
      const [ta, a] = STRIP_KEYS[i];
      const [tb, b] = STRIP_KEYS[Math.min(i + 1, STRIP_KEYS.length - 1)];
      const k = tb > ta ? smooth((t - ta) / (tb - ta)) : 0;
      const A = STRIP_POSES[a], B = STRIP_POSES[b];
      strip.position.copy(A.p).lerp(B.p, k);
      strip.rotation.set(0, A.yaw + (B.yaw - A.yaw) * k, 0);
    }

    // ----- 電源鍵按下的漣漪 -----
    const pressRipple = new THREE.Mesh(
      new THREE.RingGeometry(0.1, 0.13, 40),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, toneMapped: false })
    );
    pressRipple.rotation.x = -Math.PI / 2;
    pressRipple.position.y = 0.06;
    power.add(pressRipple);

    // ----- 虛線連線與資料光點 -----
    const phonePos = phoneScreen.getWorldPosition(new THREE.Vector3());
    const laptopPos = lapScreen.getWorldPosition(new THREE.Vector3());
    function makeDashes(a, b, lift, color, count = 28) {
      const mid = a.clone().add(b).multiplyScalar(0.5);
      mid.y += lift;
      const curve = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone());
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false, toneMapped: false });
      const geo = new THREE.BoxGeometry(0.035, 0.035, 0.11);
      const group = new THREE.Group();
      for (let i = 0; i < count; i++) {
        const u = (i + 0.5) / count;
        const m = new THREE.Mesh(geo, mat);
        m.position.copy(curve.getPoint(u));
        m.lookAt(m.position.clone().add(curve.getTangent(u)));
        group.add(m);
      }
      scene.add(group);
      return { curve, group, mat };
    }
    function showDashes(d, progress, opacity) {
      d.mat.opacity = opacity;
      d.group.visible = opacity > 0.01;
      const n = d.group.children.length;
      d.group.children.forEach((m, i) => { m.visible = (i + 0.5) / n <= progress; });
    }
    function makeParticles(curve, color, n = 6) {
      const core = new THREE.SphereGeometry(0.07, 16, 12);
      const halo = new THREE.SphereGeometry(0.16, 16, 12);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
      const haloMat = new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.35, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending,
      });
      const list = [];
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(core, coreMat);
        m.add(new THREE.Mesh(halo, haloMat));
        m.visible = false;
        scene.add(m);
        list.push(m);
      }
      return { curve, list };
    }
    function showParticles(P, t, start, travel = 1.6, gap = 0.3) {
      P.list.forEach((m, i) => {
        const s = (t - start - i * gap) / travel;
        m.visible = s > 0 && s < 1;
        if (m.visible) m.position.copy(P.curve.getPoint(smooth(s)));
      });
    }
    const loginLink = makeDashes(phonePos, scrC, 1.3, 0x2f6fe0);                 // STEP 3
    const toPhone = makeDashes(scrC, phonePos, 2.2, 0x22b866);                   // STEP 8
    const toLaptop = makeDashes(scrC, laptopPos, 2.2, 0x22b866);
    const dotsPhone = makeParticles(toPhone.curve, 0x35e08a);
    const dotsLaptop = makeParticles(toLaptop.curve, 0x35e08a);

    // ----- 依時間 t 設定所有螢幕與物件 -----
    function applyTimeline(t) {
      // 分析儀螢幕
      if (t < 11.3) setScreen('analyzer', 'off');
      else if (t < 14.8) setScreen('analyzer', 'booting', q(clamp01((t - 11.3) / 3.3), 0.02));
      else if (t < 18.6) setScreen('analyzer', 'home', t >= 17 && t < 17.8 ? { tap: q((t - 17) / 0.8, 0.05) } : undefined);
      else if (t < 23.5) setScreen('analyzer', 'loginQR');
      else if (t < 31) setScreen('analyzer', 'insertStrip');
      else if (t < 34) setScreen('analyzer', 'scanning', q((t - 31) * 5, 0.1));
      else if (t < 36) setScreen('analyzer', 'verified');
      else if (t < 41) {
        const u = clamp01((t - 36) / 4.6);   // 15 → 0（最後 0.4 秒停在 0）
        setScreen('analyzer', 'countdown', { sec: Math.ceil(15 * (1 - u)), total: 15, frac: q(1 - u, 0.005), badge: '縮時示範' });
      }
      else if (t < 44.6) setScreen('analyzer', 'analyzing', Math.round(clamp01((t - 41) / 3.4) * 100));
      else if (t < 46.2) setScreen('analyzer', 'result', 5.0);
      else if (t < 55.5) setScreen('analyzer', 'saved', 5.0);
      else setScreen('analyzer', 'home');

      // 手機
      if (t < 20.6) setScreen('phone', 'login');
      else if (t < 23) setScreen('phone', 'camera');
      else if (t < 48.7) setScreen('phone', 'loginSuccess');
      else setScreen('phone', 'latestResult', 5.0);

      // 筆電
      if (t < 49.2) setScreen('laptop', 'overview', { today: 12 });
      else setScreen('laptop', 'table', 5.0);

      // STEP 1：按下電源鍵（往下壓再彈起）＋ 漣漪 ＋ 綠燈亮起時跳一下
      powerBtn.position.y = 0.025 - 0.02 * (ramp(t, 10.8, 11.0) - ramp(t, 11.1, 11.4));
      const rp = (t - 10.9) / 0.8;
      pressRipple.visible = rp > 0 && rp < 1;
      if (pressRipple.visible) {
        pressRipple.scale.setScalar(1 + 2.2 * rp);
        pressRipple.material.opacity = 0.9 * (1 - rp);
      }
      const pk = (t - 11.3) / 0.7;
      ring.scale.setScalar(pk > 0 && pk < 1 ? 1 + 0.3 * Math.sin(pk * Math.PI) : 1);

      // 艙門：STEP 4 開→關，STEP 9 開→關
      doorHinge.rotation.x = Math.PI * 0.5 *
        (ramp(t, 25.4, 26.4) - ramp(t, 29.3, 30.2) + ramp(t, 52.3, 53.2) - ramp(t, 55.9, 56.7));

      // 試片
      stripAt(t);

      // STEP 3：手機 ↔ 分析儀 虛線連線
      showDashes(loginLink, ramp(t, 21.2, 22.4), ramp(t, 21.1, 21.3) * (1 - ramp(t, 24.2, 24.8)));

      // STEP 8：資料光點傳到手機與筆電
      const syncOpacity = 0.55 * ramp(t, 46.4, 46.9) * (1 - ramp(t, 51.2, 51.8));
      showDashes(toPhone, 1, syncOpacity);
      showDashes(toLaptop, 1, syncOpacity);
      showParticles(dotsPhone, t, 47.0);
      showParticles(dotsLaptop, t, 47.3);
    }

    // ----- 字卡、設備標籤、淡入淡出 -----
    const $ = id => document.getElementById(id);
    const titleCard = $('titleCard'), endCard = $('endCard'), fadeEl = $('fade');
    const stepEl = $('step'), stepNo = stepEl.querySelector('.no'), stepTitle = stepEl.querySelector('.title');
    const LABELS = [
      [V(-0.3, 2.35, 0), 'QA-100 分析儀', 4.6],
      [V(-3.5, 1.8, 0.0), '筆電・後台系統', 5.4],
      [V(3.3, 1.85, 0.5), '手機・會員 App', 6.2],
      [V(0.3, 0.45, 2.4), '檢測試片', 7.0],
    ].map(([pos, text, at]) => {
      const el = document.createElement('div');
      el.className = 'label';
      el.textContent = text;
      $('labels').appendChild(el);
      return { pos, el, at };
    });
    let shownSeg = -1;
    const tmpV = new THREE.Vector3();
    function updateOverlay(t) {
      titleCard.style.opacity = ramp(t, 0.4, 1.6) * (1 - ramp(t, 3.3, 3.9));
      titleCard.style.transform = `translateY(${(1 - ramp(t, 0.4, 1.6)) * 1.5}cqw)`;
      endCard.style.opacity = ramp(t, 58, 59.2);
      fadeEl.style.opacity = Math.max(1 - ramp(t, 0, 1), 0.88 * ramp(t, 57.2, 58.6));

      const i = segIndex(t), seg = SEGS[i];
      if (i !== shownSeg) {
        shownSeg = i;
        stepNo.textContent = seg[3] || '';
        stepTitle.textContent = seg[4] || '';
      }
      stepEl.style.opacity = seg[4] ? ramp(t, seg[0] + 0.3, seg[0] + 0.9) * (1 - ramp(t, seg[1] - 0.5, seg[1] - 0.1)) : 0;

      for (const L of LABELS) {
        const o = ramp(t, L.at, L.at + 0.5) * (1 - ramp(t, 9.4, 9.9));
        L.el.style.opacity = o;
        if (o <= 0) continue;
        tmpV.copy(L.pos).project(camera);
        L.el.style.left = `${(tmpV.x * 0.5 + 0.5) * 100}%`;
        L.el.style.top = `${(-tmpV.y * 0.5 + 0.5) * 100}%`;
        L.el.style.marginTop = `${(1 - o) * 1}cqw`;
      }
    }

    // ---------- 滑鼠拖曳（暫停時可自由旋轉視角） ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 1.5;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // 不讓鏡頭鑽到地板下
    controls.enabled = false;

    // ---------- 播放控制 ----------
    let T = 0, playing = true, resumeFrom = null;
    const playBtn = $('playBtn'), fill = $('fill'), timeEl = $('time'), bar = $('bar');
    SEGS.slice(1).forEach(s => {
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.left = `${s[0] / DURATION * 100}%`;
      bar.appendChild(tick);
    });
    function play() {
      if (playing) return;
      playing = true;
      resumeFrom = { p: camera.position.clone(), t: controls.target.clone(), at: T };  // 從目前視角平滑回到運鏡
      controls.enabled = false;
      stage.classList.remove('free');
      playBtn.textContent = '❚❚';
    }
    function pause() {
      if (!playing) return;
      playing = false;
      controls.enabled = true;       // 暫停時可以拖曳看四周
      stage.classList.add('free');
      playBtn.textContent = '▶';
    }
    function seek(t) {
      T = Math.min(Math.max(t, 0), DURATION - 0.001);
      resumeFrom = null;
      if (!playing) applyTimeline(T);
    }
    playBtn.addEventListener('click', () => (playing ? pause() : play()));
    bar.addEventListener('click', e => {
      const r = bar.getBoundingClientRect();
      seek((e.clientX - r.left) / r.width * DURATION);
    });
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    });
    let hudTimer;
    stage.addEventListener('mousemove', () => {
      stage.classList.add('show-hud');
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => stage.classList.remove('show-hud'), 2500);
    });

    // 開放到主控台：player.seek(36)、player.pause()、setScreen('analyzer', 'result', 7.2)
    const player = { play, pause, seek, get time() { return T; }, DURATION };
    Object.assign(window, { setScreen, screens, player });

    // ---------- 尺寸調整 ----------
    function resize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;   // 永遠是 16:9
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- 動畫迴圈 ----------
    const clock = new THREE.Clock();
    const camTarget = new THREE.Vector3();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);
      if (playing) {
        T += dt;
        if (T >= DURATION) T -= DURATION;     // 播完自動重播
      }
      applyTimeline(T);

      if (playing) {
        const pose = cameraAt(T);
        if (resumeFrom) {                     // 暫停後恢復播放：用 1 秒滑回運鏡位置
          const k = smooth((T - resumeFrom.at) / 1.0);
          pose.p = resumeFrom.p.clone().lerp(pose.p, k);
          pose.t = resumeFrom.t.clone().lerp(pose.t, k);
          if (k >= 1 || T < resumeFrom.at) resumeFrom = null;
        }
        camera.position.copy(pose.p);
        camTarget.copy(pose.t);
        camera.lookAt(camTarget);
        controls.target.copy(camTarget);      // 暫停時從目前畫面接手拖曳
      } else {
        controls.update();
      }

      updateOverlay(T);
      const shown = T.toFixed(1);
      if (timeEl.textContent !== `${shown} / ${DURATION}s`) {
        timeEl.textContent = `${shown} / ${DURATION}s`;
        fill.style.width = `${T / DURATION * 100}%`;
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
