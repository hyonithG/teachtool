<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js 測試場景</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b1f24;           /* 16:9 畫面以外的留白 */
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 固定 16:9，依視窗大小縮放並置中 */
    #stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      container-type: size;        /* 讓字卡用 cqw 隨畫面等比縮放 */
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: #1d2733;
    }
    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #stage.free canvas { cursor: grab; }
    #stage.free canvas:active { cursor: grabbing; }

    /* ----- 疊在 3D 上的影片字卡層（全部用 cqw，跟著畫面寬度等比縮放） ----- */
    :root { --teal: #14b8a6; --navy: #16213a; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    #fade { background: #eef2f6; opacity: 0; }

    /* 片頭：左側大標題 */
    #titleCard {
      position: absolute; left: 6cqw; top: 50%; transform: translateY(-50%);
      opacity: 0;
    }
    #titleCard .eyebrow { font-size: 1.4cqw; font-weight: 700; color: var(--teal); letter-spacing: 0.3em; }
    #titleCard .big { margin-top: 0.8cqw; font-size: 5.4cqw; font-weight: 900; line-height: 1.15; letter-spacing: 0.02em; }
    #titleCard .rule { width: 6cqw; height: 0.45cqw; border-radius: 1cqw; background: var(--teal); margin-top: 1.6cqw; }

    /* 片尾：置中產品名 */
    #endCard {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; text-align: center;
    }
    #endCard .big { font-size: 7cqw; font-weight: 900; letter-spacing: 0.04em; line-height: 1; }
    #endCard .sub { margin-top: 1.4cqw; font-size: 2.2cqw; font-weight: 700; color: #4b5866; letter-spacing: 0.4em; padding-left: 0.4em; }
    #endCard .rule { width: 5cqw; height: 0.4cqw; border-radius: 1cqw; background: var(--teal); margin-top: 1.8cqw; }

    /* 左上：白色膠囊進度條，9 個圓點，目前步驟拉長 */
    #progress {
      position: absolute; left: 3cqw; top: 2.6cqw;
      display: flex; align-items: center; gap: 0.7cqw;
      padding: 0.85cqw 1.2cqw;
      background: rgba(255, 255, 255, 0.95); border-radius: 10cqw;
      box-shadow: 0 0.4cqw 1.6cqw rgba(22, 33, 58, 0.15);
      opacity: 0;
    }
    #progress .dot {
      width: 0.75cqw; height: 0.75cqw; border-radius: 1cqw;
      background: #cfd6de;
      transition: width 0.35s ease, background 0.35s ease;
    }
    #progress .dot.done { background: #9fded6; }
    #progress .dot.now { width: 2.8cqw; background: var(--teal); }

    /* 右上：縮時示範 */
    #badge {
      position: absolute; right: 3cqw; top: 2.6cqw;
      display: flex; align-items: center; gap: 0.6cqw;
      padding: 0.75cqw 1.4cqw;
      background: rgba(22, 33, 58, 0.88); color: #fff; border-radius: 10cqw;
      font-size: 1.3cqw; font-weight: 800; letter-spacing: 0.08em;
      opacity: 0;
    }
    #badge::before { content: '⏩'; font-size: 1.1cqw; }

    /* 左下：白色說明卡（左側青色邊條） */
    #card {
      position: absolute; left: 3cqw; bottom: 6.5cqw;
      width: 34cqw; padding: 1.4cqw 1.8cqw 1.4cqw 2.4cqw;
      background: rgba(255, 255, 255, 0.96); border-radius: 1.1cqw;
      box-shadow: 0 0.6cqw 2.4cqw rgba(22, 33, 58, 0.18);
      overflow: hidden; opacity: 0;
    }
    #card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0.55cqw; background: var(--teal); }
    #card .tag {
      display: inline-block; padding: 0.25cqw 0.75cqw; border-radius: 0.5cqw;
      background: #e3f6f3; color: #0f8f82; font-size: 1.05cqw; font-weight: 800; letter-spacing: 0.08em;
    }
    #card .title { margin-top: 0.6cqw; font-size: 2.4cqw; font-weight: 900; }
    #card .desc { margin-top: 0.4cqw; font-size: 1.3cqw; color: #4b5866; line-height: 1.5; }

    /* 總覽：設備標籤（CSS2DRenderer） */
    .devtag { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
    .devtag .pill {
      background: var(--navy); color: #fff; white-space: nowrap;
      font-size: 1.25cqw; font-weight: 700; letter-spacing: 0.04em;
      padding: 0.55cqw 1.1cqw; border-radius: 0.7cqw;
      box-shadow: 0 0.4cqw 1.4cqw rgba(22, 33, 58, 0.3);
    }
    .devtag .stem { width: 0.14cqw; height: 3.2cqw; background: var(--navy); transform-origin: top; }
    .devtag .end { width: 0.75cqw; height: 0.75cqw; border-radius: 50%; background: var(--navy); border: 0.18cqw solid #fff; margin-top: -0.1cqw; }

    /* ----- 播放控制列（按 H 可隱藏，方便錄影） ----- */
    #hud {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 1.2cqw;
      padding: 1cqw 2cqw;
      background: linear-gradient(transparent, rgba(15, 23, 34, 0.55));
      transition: opacity 0.3s;
    }
    #stage.hide-hud #hud { opacity: 0; pointer-events: none; }
    #bar { touch-action: none; }
    #bar .knob {
      position: absolute; top: 50%; width: 1.5cqw; height: 1.5cqw; border-radius: 50%;
      background: #fff; transform: translate(-50%, -50%);
      box-shadow: 0 0.2cqw 0.6cqw rgba(0, 0, 0, 0.35);
    }
    #hud button {
      width: 3cqw; height: 3cqw; border: 0; border-radius: 50%;
      background: #fff; color: #16213a; font-size: 1.2cqw; cursor: pointer;
    }
    #bar { position: relative; flex: 1; height: 0.6cqw; background: rgba(255, 255, 255, 0.35); border-radius: 1cqw; cursor: pointer; }
    #fill { position: absolute; left: 0; top: 0; bottom: 0; background: #22b866; border-radius: 1cqw; }
    #bar .tick { position: absolute; top: -0.3cqw; width: 0.15cqw; height: 1.2cqw; background: rgba(255, 255, 255, 0.7); }
    #time { color: #fff; font-size: 1.2cqw; font-variant-numeric: tabular-nums; min-width: 7cqw; text-align: right; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <div class="layer" id="fade"></div>
    <div class="layer">
      <div id="titleCard">
        <div class="eyebrow">OPERATION GUIDE</div>
        <div class="big">QA-100<br>操作指南</div>
        <div class="rule"></div>
      </div>
      <div id="progress"></div>
      <div id="badge">縮時示範</div>
      <div id="card"><span class="tag"></span><div class="title"></div><div class="desc"></div></div>
      <div id="endCard">
        <div class="big">QA-100</div>
        <div class="sub">操作說明</div>
        <div class="rule"></div>
      </div>
    </div>
    <div id="hud">
      <button id="playBtn" title="播放／暫停（空白鍵）">❚❚</button>
      <button id="restartBtn" title="從頭播放">⏮</button>
      <div id="bar"><div id="fill"></div><div class="knob" id="knob"></div></div>
      <span id="time">0.0 / 61s</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const stage = document.getElementById('stage');

    // ---------- Renderer ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;   // 柔和陰影
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    // ---------- Scene：淺灰藍背景 + 霧 ----------
    const BG = 0xb8c6d4;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG);
    scene.fog = new THREE.Fog(BG, 16, 50);

    // ---------- Camera（固定 16:9） ----------
    const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 200);
    camera.position.set(1.5, 4.3, 8.6);

    // ---------- Lights ----------
    // 天空光：上方偏藍白、下方偏地面灰
    const hemi = new THREE.HemisphereLight(0xe6f0ff, 0x8a8f96, 1.5);
    scene.add(hemi);

    // 太陽光：產生陰影
    const sun = new THREE.DirectionalLight(0xfff4e5, 2.2);
    sun.position.set(-6, 9, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
    sun.shadow.radius = 4;
    scene.add(sun);

    // ---------- 地板 ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0xc9d3dc, roughness: 1, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // =====================================================
    //  設備（全部由基本形狀組成）
    // =====================================================

    // ---------- 共用材質 ----------
    const M = {
      white:    new THREE.MeshStandardMaterial({ color: 0xf7f8fa, roughness: 0.45 }),
      offWhite: new THREE.MeshStandardMaterial({ color: 0xe9ecef, roughness: 0.4 }),
      screen:   new THREE.MeshStandardMaterial({ color: 0x0a0b0d, roughness: 0.2, metalness: 0.1 }),
      dark:     new THREE.MeshStandardMaterial({ color: 0x2a2e34, roughness: 0.7 }),
      silver:   new THREE.MeshStandardMaterial({ color: 0xc9cdd3, roughness: 0.35, metalness: 0.35 }),
      keys:     new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.8 }),
      stand:    new THREE.MeshStandardMaterial({ color: 0x8b929b, roughness: 0.4, metalness: 0.3 }),
      green:    new THREE.MeshStandardMaterial({ color: 0x35d07f, emissive: 0x22c06a, emissiveIntensity: 1.2 }),
      blue:     new THREE.MeshStandardMaterial({ color: 0x2f6fe0, roughness: 0.5 }),
    };

    // 小工具：圓角方塊 / 一般方塊
    const rbox = (w, h, d, r, mat) =>
      new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2, h / 2, d / 2)), mat);
    const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);

    // ---------- 中間：白色桌上型分析儀 ----------
    const analyzer = new THREE.Group();
    analyzer.name = 'analyzer';
    scene.add(analyzer);

    const BODY_W = 2.4, BODY_H = 1.4, BODY_D = 2.0;
    const body = rbox(BODY_W, BODY_H, BODY_D, 0.15, M.white);
    body.position.y = BODY_H / 2;
    analyzer.add(body);

    // 斜放觸控螢幕的楔形底座（三角形斷面擠出）
    const wedgeShape = new THREE.Shape();
    wedgeShape.moveTo(0.35, 0);     // (x = 前後方向, y = 高度)
    wedgeShape.lineTo(-0.45, 0);
    wedgeShape.lineTo(-0.45, 0.42);
    wedgeShape.closePath();
    const wedgeGeo = new THREE.ExtrudeGeometry(wedgeShape, { depth: 1.4, bevelEnabled: false });
    wedgeGeo.rotateY(-Math.PI / 2);   // 斷面 x → 世界 z，擠出方向 → 世界 -x
    const wedge = new THREE.Mesh(wedgeGeo, M.white);
    wedge.position.set(0.4, BODY_H, 0);   // x 範圍 -1.0 ~ 0.4（偏左，右後留給電源鍵）
    analyzer.add(wedge);

    // 全版黑色觸控螢幕（無白邊，蓋滿整個楔形斜面）
    const slope = Math.atan2(0.42, 0.8);
    const SLOPE_LEN = Math.hypot(0.8, 0.42);
    const bezel = rbox(1.4, 0.05, SLOPE_LEN, 0.02, M.screen);
    bezel.rotation.x = slope;
    bezel.position.set(-0.3, BODY_H + 0.21 + 0.025, -0.05);
    analyzer.add(bezel);
    const touchScreen = box(1.38, 0.006, SLOPE_LEN - 0.02, M.screen);
    touchScreen.name = 'analyzerScreen';
    touchScreen.position.y = 0.032;
    bezel.add(touchScreen);

    // 右後方：電源鍵 + 綠色指示燈環
    const power = new THREE.Group();
    power.position.set(0.82, BODY_H, -0.6);
    analyzer.add(power);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.025, 12, 40), M.green);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.012;
    ring.castShadow = false;
    power.add(ring);
    const powerBtn = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.1, 0.05, 32), M.offWhite);
    powerBtn.position.y = 0.025;
    power.add(powerBtn);

    // 前方艙門開口（深色內凹面，門打開時可見）
    const DOOR_W = 1.3, DOOR_H = 0.62;
    const cavity = box(DOOR_W - 0.06, DOOR_H - 0.06, 0.02, M.dark);
    cavity.position.set(0, 0.3 + DOOR_H / 2, BODY_D / 2 + 0.001);
    analyzer.add(cavity);

    // 艙門「轉軸群組」：轉軸在門的下緣，繞 X 軸旋轉
    //   doorHinge.rotation.x = 0          → 關閉
    //   doorHinge.rotation.x = Math.PI/2  → 往下完全打開
    const doorHinge = new THREE.Group();
    doorHinge.name = 'doorHinge';
    doorHinge.position.set(0, 0.3, BODY_D / 2);   // 門下緣、機身前表面
    analyzer.add(doorHinge);

    const door = rbox(DOOR_W, DOOR_H, 0.06, 0.03, M.offWhite);
    door.position.set(0, DOOR_H / 2, 0.03);       // 以轉軸為原點往上長
    doorHinge.add(door);
    const doorHandle = rbox(0.5, 0.06, 0.05, 0.02, M.silver);
    doorHandle.position.set(0, DOOR_H - 0.09, 0.08);
    doorHinge.add(doorHandle);

    // ---------- 左邊：銀色筆電 ----------
    const laptop = new THREE.Group();
    laptop.name = 'laptop';
    laptop.position.set(-3.5, 0, 0.4);
    laptop.rotation.y = 0.35;
    scene.add(laptop);

    const lapBase = rbox(2.0, 0.08, 1.4, 0.03, M.silver);
    lapBase.position.y = 0.04;
    laptop.add(lapBase);
    const keyboard = box(1.72, 0.006, 0.55, M.keys);
    keyboard.position.set(0, 0.082, -0.18);
    laptop.add(keyboard);
    const touchpad = box(0.62, 0.004, 0.36, M.offWhite);
    touchpad.position.set(0, 0.081, 0.38);
    laptop.add(touchpad);

    // 螢幕轉軸：在底座後緣，微微往後傾
    const lidHinge = new THREE.Group();
    lidHinge.name = 'laptopLidHinge';
    lidHinge.position.set(0, 0.08, -0.68);
    lidHinge.rotation.x = -0.22;
    laptop.add(lidHinge);
    const lid = rbox(2.0, 1.3, 0.06, 0.03, M.silver);
    lid.position.set(0, 0.65, -0.03);
    lidHinge.add(lid);
    const lapScreen = box(1.84, 1.12, 0.006, M.screen);
    lapScreen.name = 'laptopScreen';
    lapScreen.position.set(0, 0.67, 0.002);
    lidHinge.add(lapScreen);

    // ---------- 右邊：立架上的手機 ----------
    const phoneStand = new THREE.Group();
    phoneStand.name = 'phoneStand';
    phoneStand.position.set(3.3, 0, 0.5);
    phoneStand.rotation.y = -0.35;
    scene.add(phoneStand);

    const standBase = rbox(0.85, 0.06, 0.75, 0.03, M.stand);
    standBase.position.y = 0.03;
    phoneStand.add(standBase);

    // 傾斜的部分（背板 + 托唇 + 手機）
    const lean = new THREE.Group();
    lean.position.set(0, 0.06, 0.12);
    lean.rotation.x = -0.3;
    phoneStand.add(lean);

    const backPlate = rbox(0.6, 1.0, 0.05, 0.02, M.stand);
    backPlate.position.set(0, 0.5, -0.065);
    lean.add(backPlate);
    const lip = rbox(0.7, 0.12, 0.06, 0.02, M.stand);
    lip.position.set(0, 0.06, 0.07);
    lean.add(lip);
    const brace = box(0.08, 0.06, 0.5, M.stand);     // 底座到背板的支撐
    brace.position.set(0, 0.03, -0.2);
    lean.add(brace);

    const phone = rbox(0.62, 1.25, 0.07, 0.05, M.offWhite);
    phone.name = 'phone';
    phone.position.set(0, 0.06 + 1.25 / 2, 0);
    lean.add(phone);
    const phoneScreen = box(0.56, 1.15, 0.006, M.screen);
    phoneScreen.name = 'phoneScreen';
    phoneScreen.position.set(0, phone.position.y, 0.036);
    lean.add(phoneScreen);

    // ---------- 前方桌面：小盒子（無蓋）＋ 白色檢測試片（側邊藍色條紋） ----------
    const stripBox = new THREE.Group();
    stripBox.name = 'stripBox';
    stripBox.position.set(0.3, 0, 2.4);
    stripBox.rotation.y = 0.15;
    scene.add(stripBox);

    const BOX_W = 1.8, BOX_D = 0.56, BOX_H = 0.16, WALL = 0.04, FLOOR = 0.03;
    const trayMat = new THREE.MeshStandardMaterial({ color: 0xd4dbe2, roughness: 0.6 });
    const trayFloor = box(BOX_W, FLOOR, BOX_D, trayMat);
    trayFloor.position.y = FLOOR / 2;
    stripBox.add(trayFloor);
    [  // [寬, 深, x, z]：前、後、左、右四面牆
      [BOX_W, WALL, 0,  BOX_D / 2 - WALL / 2],
      [BOX_W, WALL, 0, -BOX_D / 2 + WALL / 2],
      [WALL, BOX_D, -BOX_W / 2 + WALL / 2, 0],
      [WALL, BOX_D,  BOX_W / 2 - WALL / 2, 0],
    ].forEach(([w, d, x, z]) => {
      const wall = box(w, BOX_H, d, trayMat);
      wall.position.set(x, BOX_H / 2, z);
      stripBox.add(wall);
    });

    // 試片：放在盒底上
    const strip = new THREE.Group();
    strip.name = 'testStrip';
    strip.position.y = FLOOR;
    stripBox.add(strip);

    const stripBody = rbox(1.6, 0.03, 0.36, 0.01, M.white);
    stripBody.position.y = 0.015;
    strip.add(stripBody);
    const stripStripe = box(1.6, 0.032, 0.06, M.blue);
    stripStripe.position.set(0, 0.016, -0.15);   // 沿著長邊的一側
    strip.add(stripStripe);

    // 所有設備都投射 / 接收陰影
    [analyzer, laptop, phoneStand, stripBox].forEach(g =>
      g.traverse(o => { if (o.isMesh) { o.castShadow = o !== ring; o.receiveShadow = true; } })
    );

    // 方便之後做動畫或在主控台測試：window.doorHinge.rotation.x = Math.PI / 2
    Object.assign(window, { scene, doorHinge, analyzer });

    // =====================================================
    //  螢幕介面：Canvas 2D 畫好後當成 CanvasTexture 貼到 3D 螢幕
    // =====================================================

    const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","WenQuanYi Zen Hei",system-ui,sans-serif';
    const C = {
      ink: '#1d2733', sub: '#6b7785', line: '#e3e8ee', bg: '#f3f6f9', white: '#ffffff',
      green: '#22b866', greenSoft: '#e6f7ee', blue: '#2f6fe0', blueSoft: '#e8f0fd',
      navy: '#16213a', amber: '#f2a33a', red: '#e5484d',
    };

    // ----- 繪圖小工具 -----
    function txt(c, s, x, y, px, o = {}) {
      c.font = `${o.weight || 500} ${px}px ${FONT}`;
      c.fillStyle = o.color || C.ink;
      c.textAlign = o.align || 'center';
      c.textBaseline = o.baseline || 'middle';
      c.fillText(String(s), x, y);
      return c.measureText(String(s)).width;
    }
    function rr(c, x, y, w, h, r, fill, stroke, lw = 2) {
      c.beginPath();
      c.roundRect(x, y, w, h, r);
      if (fill) { c.fillStyle = fill; c.fill(); }
      if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
    }

    // 示意用 QR Code 圖樣（固定亂數，不是真的可掃描 QR）
    function qr(c, x, y, size, seed = 7) {

      let r = seed;
      const rand = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
      c.fillStyle = '#fff'; c.fillRect(x - s * 2, y - s * 2, size + s * 4, size + s * 4);
      c.fillStyle = '#111';
      const inFinder = (i, j) => (i < 8 && j < 8) || (i >= N - 8 && j < 8) || (i < 8 && j >= N - 8);
      for (let j = 0; j < N; j++)
        for (let i = 0; i < N; i++)
          if (!inFinder(i, j) && rand() > 0.52) c.fillRect(x + i * s, y + j * s, s + 0.5, s + 0.5);
      [[0, 0], [N - 7, 0], [0, N - 7]].forEach(([i, j]) => {
        c.fillStyle = '#111'; c.fillRect(x + i * s, y + j * s, 7 * s, 7 * s);
        c.fillStyle = '#fff'; c.fillRect(x + (i + 1) * s, y + (j + 1) * s, 5 * s, 5 * s);
        c.fillStyle = '#111'; c.fillRect(x + (i + 2) * s, y + (j + 2) * s, 3 * s, 3 * s);
      });

      table(c, W, H, v = 5.0) {
        lBase(c, W, H, 1, '檢測結果');
        rr(c, 260, 100, W - 290, 650, 18, C.white);

          ['11/15 10:32', 'S-1115-013', 'AX-01', '測試項目 A', v, '已完成', true],

          ['11/15 08:47', 'S-1115-010', 'AX-03', '測試項目 A', 3.9, '已完成'],
          ['11/14 17:05', 'S-1114-022', 'AX-02', '測試項目 A', 5.4, '已完成'],
          ['11/14 16:40', 'S-1114-021', 'AX-01', '測試項目 B', 8.1, '已完成'],

    // ----- 螢幕註冊與 setScreen -----
    const screens = {};
    function makeScreen(name, mesh, faceIndex, w, h, ui) {
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      // 只有正面那一面貼介面，其餘面維持黑色；螢幕自己發光所以用 Basic 材質
      const lit = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
      mesh.material = Array.from({ length: 6 }, (_, i) => (i === faceIndex ? lit : M.screen));
      screens[name] = { canvas, ctx: canvas.getContext('2d'), tex, ui, state: null, value: undefined, key: null };
    }
    // BoxGeometry 的面順序：0 +x, 1 -x, 2 +y, 3 -y, 4 +z, 5 -z
    makeScreen('analyzer', touchScreen, 2, 1024, 656, analyzerUI);
    makeScreen('laptop', lapScreen, 4, 1280, 780, laptopUI);
    makeScreen('phone', phoneScreen, 4, 540, 1108, phoneUI);

    /**
     * 切換螢幕畫面。狀態與數值都沒變時不重畫，回傳 false。
     *  analyzer：off, booting(0~1), home, loginQR, insertStrip, scanning, verified,
     *            countdown(秒), analyzing(0~100), result(數值), saved(數值)
     *  phone   ：login, camera, loginSuccess, latestResult(數值)
     *  laptop  ：overview({today, week, devices, pending}), table(最新數值)
     */
    function setScreen(name, state, value) {
      const s = screens[name];
      if (!s) { console.warn(`setScreen: 沒有螢幕「${name}」`); return false; }
      const draw = s.ui[state];
      if (!draw) { console.warn(`setScreen: ${name} 沒有狀態「${state}」`); return false; }
      const key = state + '|' + JSON.stringify(value ?? null);
      if (key === s.key) return false;
      s.key = key; s.state = state; s.value = value;
      const c = s.ctx;
      c.save();
      c.clearRect(0, 0, s.canvas.width, s.canvas.height);
      draw(c, s.canvas.width, s.canvas.height, value ?? undefined);
      c.restore();
      s.tex.needsUpdate = true;
      return true;
    }

    // =====================================================
    //  分鏡時間軸
    //  每一段 = 長度 dur、鏡頭位置 cam、鏡頭看向 look、這段要做的動作 act
    //  每一幀都「從初始狀態重算」：先回到初始狀態，再依序套用已經開始的每一段
    //  → 改任何一段的長度，後面會自動順延；時間軸可以任意拖曳
    // =====================================================
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const clamp01 = x => Math.min(1, Math.max(0, x));
    const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
    const ramp = (t, a, b) => smooth((t - a) / (b - a));       // a→b 之間平滑地 0→1
    const q = (x, s) => Math.round(x / s) * s;                    // 量化，避免每一幀都重畫螢幕

    // 常用鏡位：分析儀螢幕正前方（沿著螢幕法線往外 2.55）、前方艙門
    scene.updateMatrixWorld(true);
    const scrC = touchScreen.getWorldPosition(new THREE.Vector3());
    const scrN = V(0, Math.cos(slope), Math.sin(slope));
    // 螢幕特寫：整體往左下偏移，讓螢幕落在畫面右上，避開左下說明卡
    const SCREEN_SHIFT = V(-0.34, -0.1, 0.05);
    const SCREEN = { cam: scrC.clone().addScaledVector(scrN, 3.0).add(SCREEN_SHIFT), look: scrC.clone().add(SCREEN_SHIFT) };
    const DOOR = { cam: V(2.1, 2.1, 5.3), look: V(0.1, 0.6, 1.5) };

    // ----- 分鏡表 -----
    //  act(S, u, dur)：u = 這一段開始後經過的秒數（0 ~ dur），把結果寫進狀態 S
    const STORYBOARD = [
      { name: '片頭', dur: 4, cam: V(11.5, 2.8, 2.2), look: V(0, 1.6, 2.6),
        act: (S, u) => { S.introT = u; } },

      { name: '總覽', tag: '總覽', card: '準備物品', desc: '分析儀、筆電、手機 App 與檢測試片，確認都已就位。', dur: 6, cam: V(1.6, 4.7, 9.6), look: V(0, 0.7, 0.6),
        act: (S, u, d) => { S.labels = [u, d]; } },

      { name: 'STEP 1', tag: 'STEP 1', card: '開啟電源', desc: '按下右後方電源鍵，綠色指示燈亮起後等待開機。', dur: 5, cam: V(2.7, 3.7, 2.5), look: V(0.7, 1.4, -0.5),
        act: (S, u) => {
          S.btnPress = ramp(u, 0.8, 1.0) - ramp(u, 1.1, 1.4);     // 按下電源鍵再彈起
          S.ripple = (u - 0.9) / 0.8;                              // 按鍵漣漪
          if (u >= 1.3) S.powerOn = true;                          // 電源燈亮
          S.ringPulse = (u - 1.3) / 0.7;
          if (u >= 1.3) S.analyzer = ['booting', q(clamp01((u - 1.3) / 3.3), 0.02)];
          if (u >= 4.8) S.analyzer = ['home'];
        } },

      { name: 'STEP 2', tag: 'STEP 2', card: '開始檢測', desc: '在首頁點選綠色「開始檢測」按鈕。', dur: 5, ...SCREEN,
        act: (S, u) => {
          S.analyzer = ['home', u >= 2 && u < 2.8 ? { tap: q((u - 2) / 0.8, 0.05) } : undefined];
          if (u >= 3.6) S.analyzer = ['loginQR'];
        } },

      { name: 'STEP 3', tag: 'STEP 3', card: '會員 App 登入', desc: '用手機 App 掃描螢幕上的 QR Code 完成登入。', dur: 5, cam: V(3.0, 3.3, 5.6), look: V(1.7, 1.0, 0.2),
        act: (S, u) => {
          if (u >= 0.6) S.phone = ['camera'];
          S.loginLink = [ramp(u, 1.2, 2.4), ramp(u, 1.1, 1.3) * (1 - ramp(u, 4.2, 4.8))];   // [延伸進度, 透明度]
          if (u >= 3.0) S.phone = ['loginSuccess'];
          if (u >= 3.5) S.analyzer = ['insertStrip'];
        } },

      { name: 'STEP 4', tag: 'STEP 4', card: '插入試片', desc: '打開前方艙門，將試片平穩推入到底再關門。', dur: 6, ...DOOR,
        act: (S, u) => {
          S.door = ramp(u, 0.4, 1.4) - ramp(u, 4.3, 5.2);          // 開門 → 關門
          S.strip = ramp(u, 1.6, 3.2) + ramp(u, 3.2, 4.0);         // 0 盒內 → 1 沿弧線到門口 → 2 推進機器
        } },

      { name: 'STEP 5', tag: 'STEP 5', card: '掃描試片', desc: '儀器自動讀取試片資訊，顯示驗證成功即可。', dur: 5, ...SCREEN,
        act: (S, u) => { S.analyzer = u < 3 ? ['scanning', q(u * 5, 0.1)] : ['verified']; } },

      { name: 'STEP 6', tag: 'STEP 6', card: '等待反應', desc: '靜置等待倒數結束，期間請勿開啟艙門。', badge: '縮時示範', dur: 5, ...SCREEN,
        act: (S, u, d) => {
          const k = clamp01(u / (d - 0.4));                        // 15 → 0，最後 0.4 秒停在 0
          S.analyzer = ['countdown', { sec: Math.ceil(15 * (1 - k)), total: 15, frac: q(1 - k, 0.005) }];
        } },

      { name: 'STEP 7', tag: 'STEP 7', card: '分析與結果', desc: '儀器自動分析，完成後顯示檢測數值。', dur: 5, ...SCREEN,
        act: (S, u) => { S.analyzer = u < 3.6 ? ['analyzing', Math.round(clamp01(u / 3.4) * 100)] : ['result', 5.0]; } },

      { name: 'STEP 8', tag: 'STEP 8', card: '結果同步', desc: '結果自動上傳，手機 App 與後台同步更新。', dur: 6, cam: V(0.4, 11.3, 5.9), look: V(0, 0, 0.6),
        act: (S, u) => {
          if (u >= 0.2) S.analyzer = ['saved', 5.0];
          S.sync = 0.55 * ramp(u, 0.4, 0.9) * (1 - ramp(u, 5.2, 5.8));   // 虛線透明度
          S.syncT = u;                                                     // 光點依這個時間移動
          if (u >= 2.7) S.phone = ['latestResult', 5.0];
          if (u >= 3.2) S.laptop = ['table', 5.0];
        } },

      { name: 'STEP 9', tag: 'STEP 9', card: '取出試片', desc: '打開艙門取出試片，儀器回到首頁。', dur: 5, ...DOOR,
        act: (S, u) => {
          S.door = ramp(u, 0.3, 1.2) - ramp(u, 3.9, 4.7);
          S.strip = 2 - ramp(u, 1.4, 2.2) - ramp(u, 2.2, 3.9);     // 滑出到門口 → 沿弧線回到盒子
          if (u >= 3.5) S.analyzer = ['home'];
        } },

      { name: '片尾', dur: 4, cam: V(2.0, 5.4, 11), look: V(0, 0.8, 0.6),
        act: (S, u) => { S.outroT = u; } },
    ];
    let DURATION = 0;
    for (const seg of STORYBOARD) { seg.start = DURATION; DURATION += seg.dur; }

    // ----- 初始狀態 -----
    const initialState = () => ({
      analyzer: ['off'], phone: ['login'], laptop: ['overview', { today: 12 }],
      powerOn: false, btnPress: 0, ripple: -1, ringPulse: -1,
      door: 0, strip: 0,
      loginLink: [0, 0], sync: 0, syncT: -1,
      introT: -1, labels: [-1, 1], outroT: -1,
    });
    // 從初始狀態開始，依序套用 t 之前已經開始的每一段
    function stateAt(t) {
      const S = initialState();
      for (const seg of STORYBOARD) {
        if (t < seg.start) break;
        seg.act?.(S, Math.min(t - seg.start, seg.dur), seg.dur);
      }
      return S;
    }
    const segIndexAt = t => {
      const i = STORYBOARD.findIndex(s => t < s.start + s.dur);
      return i < 0 ? STORYBOARD.length - 1 : i;
    };

    // ----- 鏡頭：換段時 1.4 秒平滑移動，之後緩慢推近 -----
    const BLEND = 1.4, PUSH = 0.12;     // PUSH：每段結束時往目標推近 12% 的距離
    function segPose(seg, u) {
      const k = clamp01(u / seg.dur);
      return { p: seg.cam.clone().lerp(seg.look, PUSH * k), t: seg.look.clone() };
    }
    function cameraAt(t) {
      const i = segIndexAt(t), seg = STORYBOARD[i], u = t - seg.start;
      const pose = segPose(seg, u);
      if (i > 0 && u < BLEND) {
        const prev = STORYBOARD[i - 1];
        const from = segPose(prev, prev.dur);
        const k = smooth(u / BLEND);
        pose.p = from.p.lerp(pose.p, k);
        pose.t = from.t.lerp(pose.t, k);
      }
      return pose;
    }

    // ----- 試片：沿弧線飛到艙門口，再推進機器 -----
    const restPos = strip.getWorldPosition(new THREE.Vector3());
    const restYaw = stripBox.rotation.y;
    scene.attach(strip);                      // 改掛在場景下，直接用世界座標控制
    const MOUTH = V(0, 0.6, 1.95), INSIDE = V(0, 0.6, 0.15);
    const flyArc = new THREE.QuadraticBezierCurve3(restPos.clone(), V(0.15, 1.9, 2.7), MOUTH.clone());
    function placeStrip(s) {                  // s：0 盒內、1 艙門口、2 機器內
      if (s <= 1) {
        strip.position.copy(flyArc.getPoint(s));
        strip.rotation.set(-0.35 * Math.sin(s * Math.PI), restYaw + (Math.PI / 2 - restYaw) * s, 0);
      } else {
        strip.position.copy(MOUTH).lerp(INSIDE, s - 1);
        strip.rotation.set(0, Math.PI / 2, 0);
      }
    }

    // ----- 電源鍵漣漪 -----
    const pressRipple = new THREE.Mesh(
      new THREE.RingGeometry(0.1, 0.13, 40),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, toneMapped: false })
    );
    pressRipple.rotation.x = -Math.PI / 2;
    pressRipple.position.y = 0.06;
    power.add(pressRipple);

    // ----- 虛線與資料光點 -----
    const phonePos = phoneScreen.getWorldPosition(new THREE.Vector3());
    const laptopPos = lapScreen.getWorldPosition(new THREE.Vector3());
    function makeDashes(a, b, lift, color, count = 28) {
      const mid = a.clone().add(b).multiplyScalar(0.5);
      mid.y += lift;
      const curve = new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone());
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false, toneMapped: false });
      const geo = new THREE.BoxGeometry(0.035, 0.035, 0.11);
      const group = new THREE.Group();
      for (let i = 0; i < count; i++) {
        const u = (i + 0.5) / count;
        const m = new THREE.Mesh(geo, mat);
        m.position.copy(curve.getPoint(u));
        m.lookAt(m.position.clone().add(curve.getTangent(u)));
        group.add(m);
      }
      scene.add(group);
      return { curve, group, mat };
    }
    function showDashes(d, progress, opacity) {
      d.mat.opacity = opacity;
      d.group.visible = opacity > 0.01;
      const n = d.group.children.length;
      d.group.children.forEach((m, i) => { m.visible = (i + 0.5) / n <= progress; });
    }
    function makeParticles(curve, color, n = 6) {
      const core = new THREE.SphereGeometry(0.07, 16, 12);
      const halo = new THREE.SphereGeometry(0.16, 16, 12);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
      const haloMat = new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.35, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending,
      });
      const list = [];
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(core, coreMat);
        m.add(new THREE.Mesh(halo, haloMat));
        m.visible = false;
        scene.add(m);
        list.push(m);
      }
      return { curve, list };
    }
    function showParticles(P, t, start, travel = 1.6, gap = 0.3) {
      P.list.forEach((m, i) => {
        const s = (t - start - i * gap) / travel;
        m.visible = s > 0 && s < 1;
        if (m.visible) m.position.copy(P.curve.getPoint(smooth(s)));
      });
    }
    const loginLink = makeDashes(phonePos, scrC, 1.3, 0x2f6fe0);
    const toPhone = makeDashes(scrC, phonePos, 2.2, 0x22b866);
    const toLaptop = makeDashes(scrC, laptopPos, 2.2, 0x22b866);
    const dotsPhone = makeParticles(toPhone.curve, 0x35e08a);
    const dotsLaptop = makeParticles(toLaptop.curve, 0x35e08a);

    // ----- 把狀態套用到場景 -----
    function applyState(S) {
      setScreen('analyzer', ...S.analyzer);
      setScreen('phone', ...S.phone);
      setScreen('laptop', ...S.laptop);
      M.green.emissiveIntensity = S.powerOn ? 1.2 : 0;

      powerBtn.position.y = 0.025 - 0.02 * S.btnPress;
      pressRipple.visible = S.ripple > 0 && S.ripple < 1;
      if (pressRipple.visible) {
        pressRipple.scale.setScalar(1 + 2.2 * S.ripple);
        pressRipple.material.opacity = 0.9 * (1 - S.ripple);
      }
      ring.scale.setScalar(S.ringPulse > 0 && S.ringPulse < 1 ? 1 + 0.3 * Math.sin(S.ringPulse * Math.PI) : 1);

      doorHinge.rotation.x = Math.PI * 0.5 * S.door;
      placeStrip(S.strip);

      showDashes(loginLink, ...S.loginLink);
      showDashes(toPhone, 1, S.sync);
      showDashes(toLaptop, 1, S.sync);
      showParticles(dotsPhone, S.syncT, 1.0);
      showParticles(dotsLaptop, S.syncT, 1.3);
    }

    // ----- 影片字卡：片頭、進度條、說明卡、縮時示範、片尾 -----
    const $ = id => document.getElementById(id);
    const titleCard = $('titleCard'), endCard = $('endCard'), fadeEl = $('fade');
    const progressEl = $('progress'), badgeEl = $('badge');
    const cardEl = $('card'), cardTag = cardEl.querySelector('.tag');
    const cardTitle = cardEl.querySelector('.title'), cardDesc = cardEl.querySelector('.desc');

    // 進度條：每個 STEP 一個圓點
    const STEP_SEGS = STORYBOARD.filter(s => /^STEP/.test(s.tag || ''));
    const dots = STEP_SEGS.map(() => {
      const d = document.createElement('div');
      d.className = 'dot';
      progressEl.appendChild(d);
      return d;
    });

    // 總覽：設備標籤＋指引線（CSS2DRenderer，跟著 3D 位置走）
    const labelRenderer = new CSS2DRenderer();
    Object.assign(labelRenderer.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
    stage.insertBefore(labelRenderer.domElement, stage.firstChild);   // 放在其他字卡下面
    const DEVICE_TAGS = [
      [V(-0.3, 1.95, 0.05), 'QA-100 分析儀'],
      [V(-3.6, 1.42, 0.05), '筆電・後台系統'],
      [V(3.3, 1.38, 0.42), '手機・會員 App'],
      [V(0.3, 0.17, 2.4), '檢測試片'],
    ].map(([pos, text]) => {
      const el = document.createElement('div');
      el.className = 'devtag';
      el.innerHTML = `<div class="pill"></div><div class="stem"></div><div class="end"></div>`;
      el.querySelector('.pill').textContent = text;
      const obj = new CSS2DObject(el);
      obj.center.set(0.5, 1);           // 元素底部（指引線末端）對準設備
      obj.position.copy(pos);
      scene.add(obj);
      return { obj, el, pill: el.querySelector('.pill'), stem: el.querySelector('.stem') };
    });

    let shownSeg = -1;
    function updateOverlay(t, S) {
      // 片頭：左側大標題淡入淡出
      const introDur = STORYBOARD[0].dur;
      const tin = ramp(S.introT, 0.4, 1.5), tout = ramp(S.introT, introDur - 0.8, introDur - 0.1);
      titleCard.style.opacity = tin * (1 - tout);
      titleCard.style.transform = `translate(${(tin - 1) * 2}cqw, -50%)`;

      // 片尾：畫面變淡，置中產品名
      endCard.style.opacity = ramp(S.outroT, 1.0, 2.2);
      endCard.style.transform = `translateY(${(1 - ramp(S.outroT, 1.0, 2.2)) * 1.5}cqw)`;
      fadeEl.style.opacity = Math.max(1 - ramp(t, 0, 1), 0.9 * ramp(S.outroT, 0.2, 1.6));

      const i = segIndexAt(t), seg = STORYBOARD[i], u = t - seg.start;

      // 左上進度條：總覽到 STEP 9 期間顯示
      const first = STORYBOARD[1], last = STEP_SEGS[STEP_SEGS.length - 1];
      progressEl.style.opacity = ramp(t, first.start + 0.3, first.start + 0.9) *
        (1 - ramp(t, last.start + last.dur - 0.3, last.start + last.dur + 0.3));
      const stepNo = STEP_SEGS.indexOf(seg);
      dots.forEach((d, k) => {
        d.classList.toggle('now', k === stepNo);
        d.classList.toggle('done', stepNo >= 0 && k < stepNo);
      });

      // 左下說明卡：換段時由下往上滑入
      if (i !== shownSeg) {
        shownSeg = i;
        cardTag.textContent = seg.tag || '';
        cardTitle.textContent = seg.card || '';
        cardDesc.textContent = seg.desc || '';
      }
      const cin = ramp(u, 0.25, 0.85), cout = ramp(u, seg.dur - 0.45, seg.dur - 0.05);
      cardEl.style.opacity = seg.card ? cin * (1 - cout) : 0;
      cardEl.style.transform = `translateY(${(1 - cin) * 3}cqw)`;

      // 右上縮時示範
      badgeEl.style.opacity = seg.badge ? ramp(u, 0.2, 0.6) * (1 - ramp(u, seg.dur - 0.4, seg.dur - 0.05)) : 0;
      if (seg.badge) badgeEl.textContent = seg.badge;

      // 總覽設備標籤：依序出現，指引線往下長
      const [lu, ld] = S.labels;
      DEVICE_TAGS.forEach((L, k) => {
        const a = 0.6 + k * 0.8;
        const o = ramp(lu, a, a + 0.5) * (1 - ramp(lu, ld - 0.6, ld - 0.1));
        L.obj.visible = o > 0;
        L.el.style.opacity = o;
        L.stem.style.transform = `scaleY(${ramp(lu, a, a + 0.5)})`;
        L.pill.style.transform = `translateY(${(1 - ramp(lu, a, a + 0.5)) * 1.2}cqw)`;
      });
    }

    // ---------- 滑鼠拖曳（暫停時可自由旋轉視角） ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 1.5;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // 不讓鏡頭鑽到地板下
    controls.enabled = false;

    // ---------- 播放控制：播放／暫停、從頭、時間拖曳列 ----------
    let T = 0, playing = true, scrubbing = false, resumeFrom = null;
    const playBtn = $('playBtn'), restartBtn = $('restartBtn');
    const fill = $('fill'), knob = $('knob'), timeEl = $('time'), bar = $('bar');
    STORYBOARD.slice(1).forEach(s => {
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.left = `${s.start / DURATION * 100}%`;
      bar.appendChild(tick);
    });
    function setFree(free) {               // 暫停時才能用滑鼠轉視角
      controls.enabled = free;
      stage.classList.toggle('free', free);
    }
    function play() {
      if (playing) return;
      playing = true;
      resumeFrom = { p: camera.position.clone(), t: controls.target.clone(), at: T };   // 從目前視角平滑接回運鏡
      setFree(false);
      playBtn.textContent = '❚❚';
    }
    function pause() {
      if (!playing) return;
      playing = false;
      setFree(true);
      playBtn.textContent = '▶';
    }
    function seek(t) {
      T = Math.min(Math.max(t, 0), DURATION - 0.001);
      resumeFrom = null;
    }
    function restart() { seek(0); play(); }
    const toggle = () => (playing ? pause() : play());

    playBtn.addEventListener('click', () => { toggle(); playBtn.blur(); });
    restartBtn.addEventListener('click', () => { restart(); restartBtn.blur(); });

    // 拖曳時間列：拖曳期間鏡頭跟著時間軸走，放開後回到原本的播放／暫停狀態
    const seekFromPointer = e => {
      const r = bar.getBoundingClientRect();
      seek((e.clientX - r.left) / r.width * DURATION);
    };
    bar.addEventListener('pointerdown', e => {
      scrubbing = true;
      setFree(false);
      bar.setPointerCapture(e.pointerId);
      seekFromPointer(e);
    });
    bar.addEventListener('pointermove', e => { if (scrubbing) seekFromPointer(e); });
    const endScrub = () => {
      if (!scrubbing) return;
      scrubbing = false;
      if (!playing) setFree(true);
    };
    bar.addEventListener('pointerup', endScrub);
    bar.addEventListener('pointercancel', endScrub);

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); toggle(); }
      if (e.code === 'KeyH') stage.classList.toggle('hide-hud');
    });

    // 開放到主控台：player.seek(36)、player.restart()、STORYBOARD[3].dur = 8（改長度後重新整理即可）
    const player = { play, pause, seek, restart, get time() { return T; }, get duration() { return DURATION; } };
    Object.assign(window, { setScreen, screens, player, STORYBOARD });

    // ---------- 尺寸調整 ----------
    function resize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      renderer.setSize(w, h, false);
      labelRenderer.setSize(w, h);
      camera.aspect = w / h;   // 永遠是 16:9
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- 動畫迴圈 ----------
    const clock = new THREE.Clock();
    const fmtTime = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);
      if (playing && !scrubbing) {
        T += dt;
        if (T >= DURATION) T -= DURATION;       // 播完自動從頭
      }

      // 每一幀都從初始狀態重算
      const S = stateAt(T);
      applyState(S);

      if (playing || scrubbing) {
        const pose = cameraAt(T);
        if (resumeFrom && !scrubbing) {         // 暫停後恢復播放：1 秒滑回運鏡
          const k = smooth((T - resumeFrom.at) / 1.0);
          pose.p = resumeFrom.p.clone().lerp(pose.p, k);
          pose.t = resumeFrom.t.clone().lerp(pose.t, k);
          if (k >= 1 || T < resumeFrom.at) resumeFrom = null;
        }
        camera.position.copy(pose.p);
        camera.lookAt(pose.t);
        controls.target.copy(pose.t);           // 暫停時從目前畫面接手拖曳
      } else {
        controls.update();
      }

      updateOverlay(T, S);
      labelRenderer.render(scene, camera);
      const label = `${fmtTime(T)} / ${fmtTime(DURATION)}`;
      if (timeEl.textContent !== label) timeEl.textContent = label;
      const pct = `${T / DURATION * 100}%`;
      fill.style.width = pct;
      knob.style.left = pct;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
