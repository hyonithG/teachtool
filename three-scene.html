<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js 測試場景</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1b1f24;           /* 16:9 畫面以外的留白 */
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 固定 16:9，依視窗大小縮放並置中 */
    #stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #stage canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const stage = document.getElementById('stage');

    // ---------- Renderer ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;   // 柔和陰影
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    // ---------- Scene：淺灰藍背景 + 霧 ----------
    const BG = 0xb8c6d4;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BG);
    scene.fog = new THREE.Fog(BG, 12, 45);

    // ---------- Camera（固定 16:9） ----------
    const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 200);
    camera.position.set(6, 4.5, 8);

    // ---------- Lights ----------
    // 天空光：上方偏藍白、下方偏地面灰
    const hemi = new THREE.HemisphereLight(0xe6f0ff, 0x8a8f96, 1.5);
    scene.add(hemi);

    // 太陽光：產生陰影
    const sun = new THREE.DirectionalLight(0xfff4e5, 2.2);
    sun.position.set(-6, 9, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
    sun.shadow.radius = 4;
    scene.add(sun);

    // ---------- 地板 ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0xc9d3dc, roughness: 1, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---------- 白色圓角方塊 ----------
    const box = new THREE.Mesh(
      new RoundedBoxGeometry(2, 2, 2, 6, 0.25),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45, metalness: 0 })
    );
    box.position.y = 1;
    box.castShadow = true;
    box.receiveShadow = true;
    scene.add(box);

    // ---------- 滑鼠拖曳 + 自動旋轉 ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;           // 慢慢轉
    controls.enablePan = false;
    controls.minDistance = 4;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // 不讓鏡頭鑽到地板下
    controls.update();

    // ---------- 尺寸調整 ----------
    function resize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;   // 永遠是 16:9
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- 動畫迴圈 ----------
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
